pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

plugins {
    // Lets Gradle download the right Java (21) automatically if you don't have it
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}
